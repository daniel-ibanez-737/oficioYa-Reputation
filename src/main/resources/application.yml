spring:
  application:
    name: oficioya-reputation
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oficioya_reputation}
    username: ${DB_USER:oficioya}
    password: ${DB_PASSWORD:oficioya}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8082

oficioya:
  security:
    # Secreto compartido con Identity (Squad 1). En producción se define con la variable JWT_SECRET.
    jwt-secret: ${JWT_SECRET:Y2FtYmlhci1lc3RlLXNlY3JldG8tZGUtZGVzYXJyb2xsby1kZS1hbC1tZW5vcy0zMi1ieXRlcw==}
    roles-claim: ${JWT_ROLES_CLAIM:roles}
  orquestador:
    # Toda comunicación con otros dominios o con la IA sale por el Orchestrator.
    base-url: ${ORQUESTADOR_URL:http://localhost:8080}
    # Rutas reales de Worker (Squad 3) y Notification, a través del Orchestrator.
    rutas:
      estado-trabajador: /api/v1/workers/{trabajadorId}/status
      correo: /api/v1/notification
  reputation:
    # Id (UUID) del administrador que recibe el aviso de reseñas reportadas. En producción se define con ADMIN_ID.
    administrador-id: ${ADMIN_ID:00000000-0000-0000-0000-000000000900}
    # Tipo de notificación del aviso. Notification aún no tiene uno para reseñas reportadas: vacío = se envía null.
    tipo-aviso-reporte: ${TIPO_AVISO_REPORTE:}
    # Reglas de reputación (OFICIO-168). Se pueden cambiar sin recompilar.
    reglas:
      umbral-pausa: 3.0
      resenas-evaluadas: 5
      penalizacion-cancelacion-tardia: 0.5
      horas-limite-cancelacion: 24

# Documentación de la API (Swagger UI en /swagger-ui.html). Se puede apagar con SWAGGER_ENABLED=false.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    edu.eci.dosw.oficioya: INFO
